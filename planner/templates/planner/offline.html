<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="{{ theme_color }}">
  <title>Offline · Athlete Academic Assistant</title>
  <style>
    :root { --navy: #0a2240; --text: #121a2b; --muted: #4f5b72; --accent: #1f5fbf; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text);
      background: linear-gradient(180deg, #8cc4ee 0%, #b7dcf6 30%, #e3f1fb 62%, #f5fafe 100%) fixed;
    }
    .card {
      width: 100%; max-width: 420px; padding: 32px 28px; border-radius: 22px; text-align: center;
      background: rgba(255, 255, 255, .86); box-shadow: 0 24px 60px rgba(31, 79, 128, .14);
    }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { margin: 18px 0 8px; font-size: 1.4rem; }
    p { margin: 0 0 22px; color: var(--muted); line-height: 1.5; }
    button {
      font: inherit; font-weight: 600; color: #fff; background: var(--navy); border: 0;
      border-radius: 12px; padding: 12px 22px; min-height: 44px; cursor: pointer;
    }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    {% load static %}<img src="{% static 'planner/icons/icon-192.png' %}" alt="">
    <h1>You're offline</h1>
    <p>Your schedule needs an internet connection. Check your Wi-Fi or data and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
